<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music-Player</title><link rel="shortcut icon" href="/Frontend-Mentor-JS-Projects/Music-Player/images/mp3.png" type="image/x-icon">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <audio src="songs/Alta Makhi Official __ Sambalpuri Song __ Full Video _ Bijay Anand _ Pratham _ Pankaj _ Kiran Dash(MP3_320K).mp3" id="audio"></audio>

    <main class="main">
        <img src="/Frontend-Mentor-JS-Projects/Music-Player/images/Alta-Makhi-Oriya-2023-20230619173005-500x500.jpg " alt="" id="img" class="img">

        <div class="range-div">
            <input type="range" class="duration">
        </div>

        <div class="music-duration-div">
            <div>00:00</div>
            <div>04:00</div>
        </div>

        <div class="options">
            <div class="prenext">
                <svg fill="#000000" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" height="18px" width="18px"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path d="M13.41,12l3.3-3.29a1,1,0,1,0-1.42-1.42l-4,4a1,1,0,0,0,0,1.42l4,4a1,1,0,0,0,1.42,0,1,1,0,0,0,0-1.42ZM8,7A1,1,0,0,0,7,8v8a1,1,0,0,0,2,0V8A1,1,0,0,0,8,7Z"></path></g></svg>
            </div>

            <div class="play_pause" onclick="play_pause()" id="play_pause">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" height="18px" width="18px" ><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M21.4086 9.35258C23.5305 10.5065 23.5305 13.4935 21.4086 14.6474L8.59662 21.6145C6.53435 22.736 4 21.2763 4 18.9671L4 5.0329C4 2.72368 6.53435 1.26402 8.59661 2.38548L21.4086 9.35258Z" fill="#1C274C"></path> </g></svg>
            </div>
            
            <div class="prenext">
                <svg fill="#000000" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" height="18px" width="18px" class="flip"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path d="M13.41,12l3.3-3.29a1,1,0,1,0-1.42-1.42l-4,4a1,1,0,0,0,0,1.42l4,4a1,1,0,0,0,1.42,0,1,1,0,0,0,0-1.42ZM8,7A1,1,0,0,0,7,8v8a1,1,0,0,0,2,0V8A1,1,0,0,0,8,7Z"></path></g></svg>
            </div>
        </div>

        <div class="range-div">
            <input type="range" class="duration">
        </div>

    </main>
    <script src="index.js"></script>
</body>
</html>
